<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>

  <rect x="20" y="24" width="180" height="222" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="54" fill="#1d4ed8" font-size="15" font-weight="bold" text-anchor="middle">范式一 · 向量库式</text>
  <line x1="40" y1="68" x2="180" y2="68" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="110" y="96" fill="#64748b" font-size="11" text-anchor="middle">存在哪</text>
  <text x="110" y="114" fill="#1e3a8a" font-size="12" text-anchor="middle">向量库</text>
  <text x="110" y="152" fill="#64748b" font-size="11" text-anchor="middle">谁来写</text>
  <text x="110" y="170" fill="#1e3a8a" font-size="12" text-anchor="middle">系统自动抽取</text>
  <text x="110" y="208" fill="#64748b" font-size="11" text-anchor="middle">怎么找回来</text>
  <text x="110" y="226" fill="#1e3a8a" font-size="12" text-anchor="middle">语义相似度</text>

  <rect x="220" y="24" width="180" height="222" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="310" y="54" fill="#15803d" font-size="15" font-weight="bold" text-anchor="middle">范式二 · 图谱式</text>
  <line x1="240" y1="68" x2="380" y2="68" stroke="#86efac" stroke-width="1.5"/>
  <text x="310" y="96" fill="#64748b" font-size="11" text-anchor="middle">存在哪</text>
  <text x="310" y="114" fill="#14532d" font-size="12" text-anchor="middle">时序知识图谱</text>
  <text x="310" y="152" fill="#64748b" font-size="11" text-anchor="middle">谁来写</text>
  <text x="310" y="170" fill="#14532d" font-size="12" text-anchor="middle">抽实体与关系</text>
  <text x="310" y="208" fill="#64748b" font-size="11" text-anchor="middle">怎么找回来</text>
  <text x="310" y="226" fill="#14532d" font-size="12" text-anchor="middle">图遍历 + 关键词</text>

  <rect x="420" y="24" width="180" height="222" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="510" y="54" fill="#4338ca" font-size="15" font-weight="bold" text-anchor="middle">范式三 · 操作系统式</text>
  <line x1="440" y1="68" x2="580" y2="68" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="510" y="96" fill="#64748b" font-size="11" text-anchor="middle">存在哪</text>
  <text x="510" y="114" fill="#312e81" font-size="12" text-anchor="middle">长驻 + 归档分层</text>
  <text x="510" y="152" fill="#64748b" font-size="11" text-anchor="middle">谁来写</text>
  <text x="510" y="170" fill="#312e81" font-size="12" text-anchor="middle">Agent 自己换入换出</text>
  <text x="510" y="208" fill="#64748b" font-size="11" text-anchor="middle">怎么找回来</text>
  <text x="510" y="226" fill="#312e81" font-size="12" text-anchor="middle">Agent 主动调回</text>

  <rect x="620" y="24" width="180" height="222" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="710" y="54" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">范式四 · 文件式</text>
  <line x1="640" y1="68" x2="780" y2="68" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="710" y="96" fill="#64748b" font-size="11" text-anchor="middle">存在哪</text>
  <text x="710" y="114" fill="#78350f" font-size="12" text-anchor="middle">明文文件</text>
  <text x="710" y="152" fill="#64748b" font-size="11" text-anchor="middle">谁来写</text>
  <text x="710" y="170" fill="#78350f" font-size="12" text-anchor="middle">Agent 调 save_memory</text>
  <text x="710" y="208" fill="#64748b" font-size="11" text-anchor="middle">怎么找回来</text>
  <text x="710" y="226" fill="#78350f" font-size="12" text-anchor="middle">关键词扫描</text>

  <text x="410" y="278" fill="#64748b" font-size="12" text-anchor="middle">四个范式回答的其实是同一件事：记忆存在哪、谁来写、怎么找回来</text>
</svg>
